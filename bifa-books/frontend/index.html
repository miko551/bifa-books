const IC={shop:'<svg width=20 height=20 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M4 7h16l-1.5 12h-13z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>',lib:'<svg width=20 height=20 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>'};
const im=(u,c="",e=0)=>u?`<img ${c?`class="${c}"`:""} src="${esc(u)}" alt="" decoding=async ${e?"fetchpriority=high":'loading=lazy'}>`:`<div class="${c}" style="background:linear-gradient(135deg,#0A7A58,#064E3B)"></div>`;
function feat(p){return`<button class=feat onclick="openProduct('${p.id}')">${p.cover_url?`<img class=fbg src="${esc(p.cover_url)}" alt="" aria-hidden=true>`:""}${im(p.cover_url,"fc",1)}<div><span class=badge>${p.sales>0?"🔥 "+t("pop"):"✨ "+t("new")}</span><h2>${esc(p.title)}</h2><span class=cta onclick="${status(p.id)?"":`event.stopPropagation();checkout('${p.id}')`}">${status(p.id)?t(status(p.id)):"⬇ "+t("dl")+" · "+money(p.price)}</span></div></button>`}
const BADGE=p=>p.badge==="new"?"✨ "+t("new"):p.badge==="launch"?"🚀 "+t("launch"):"";
const was=p=>Number(p.old_price)>Number(p.price)?`<s class=was>${num(p.old_price)}</s>`:"";
const plain=s=>String(s||"").replace(/\*\*/g,"").replace(/\s+/g," ").trim();
function card(p){const s=status(p.id),b=BADGE(p);
 const act=s?`<span class=own>${s==="approved"?"✅ ":"⏳ "}${t(s)}</span>`:`<span class=dl onclick="event.stopPropagation();checkout('${p.id}')">⬇ ${t("dl")} · ${num(p.price)} ${t("etb")}</span>`;
 return`<div class=card2 onclick="openProduct('${p.id}')" role=button tabindex=0><div class=c2v>${im(p.cover_url)}${b?`<span class=tag style="background:var(--gold);color:var(--ink)">${b}</span>`:""}</div><div class=c2b><h3>${esc(p.title)}</h3>${p.reviews?`<div class=stars style="font-size:13px">★ ${p.rating} <span style="color:var(--mut)">(${p.reviews})</span></div>`:""}<div class=c2d>${esc(plain(p.description))}</div><div class=c2p>${was(p)}<span class=price>${num(p.price)}<small> ${t("etb")}</small></span></div>${act}</div></div>`}
function render(){const nm=S.me?.name||"";let h=`<div class=top><div class=bar><div class=who><i>${esc((nm||"B")[0].toUpperCase())}</i><div><h1>${t("hi")}${nm?", "+esc(nm):""}</h1><small>${t("sub")}</small></div></div><div>${S.me?.is_admin?`<a class=pill href="admin.html${location.search}">${t("admin")}</a>`:""}<button class=pill onclick="setLang()">${S.lang==="en"?"Afaan Oromoo":"English"}</button></div></div>${S.tab==="shop"?`<input class=search id=q placeholder="${t("search")}" value="${esc(S.q)}" oninput="S.q=this.value;grid()">`:""}</div>`;
 if(S.tab==="shop"){const top=[...S.products].sort((a,b)=>b.sales-a.sales).slice(0,5);
  if(!S.q&&!S.cat&&top.length)h+=`<div class=hero>${top.map(feat).join("")}</div>`;
  h+=`<div class=chips><button class="chip ${!S.cat?"on":""}" onclick="S.cat=0;render()">${t("all")}</button>${S.cats.map(c=>`<button class="chip ${S.cat===c.id?"on":""}" onclick="S.cat=${c.id};render()">${esc(catName(c))}</button>`).join("")}</div><div class=grid id=grid></div>`}
 else h+=S.orders.length?S.orders.map(o=>`<div class=row>${o.products?.cover_url?`<img src="${esc(o.products.cover_url)}" alt="" loading=lazy>`:""}<div><b>${esc(o.products?.title||"")}</b><br><small style="color:var(--mut)">${esc(o.code)} · ${money(o.price)}</small>${o.reject_reason?`<br><small style="color:var(--red)">${esc(o.reject_reason)}</small>`:""}</div><span class="st ${o.status}">${t(o.status)}</span></div>`).join(""):`<p class=empty>${t("noord")}</p>`;
 h+=`<nav><button class="${S.tab==="shop"?"on":""}" onclick="tab('shop')">${IC.shop}${t("shop")}</button><button class="${S.tab==="lib"?"on":""}" onclick="tab('lib')">${IC.lib}${t("lib")}</button></nav>`;
 $("#app").innerHTML=h;if(S.tab==="shop")grid()}
function tab(x){S.tab=x;tg?.HapticFeedback?.selectionChanged();render();scrollTo(0,0)}
function grid(){const q=S.q.toLowerCase(),l=S.products.filter(p=>(!S.cat||p.category_id===S.cat)&&p.title.toLowerCase().includes(q));$("#grid").innerHTML=l.length?l.map(card).join(""):`<p class=empty>${t("none")}</p>`}
const sheet=h=>{$("#ov").innerHTML=`<div class=ov onclick="if(event.target===this)closeSheet()"><div class=sheet role=dialog>${h}</div></div>`;document.body.style.overflow="hidden"};
const closeSheet=()=>{$("#ov").innerHTML="";document.body.style.overflow=""};
const BOT="BifaBooks_bot",CREATOR="@BifaBooks_bot";
const page=h=>{$("#ov").innerHTML=`<div class=pg>${h}</div>`;document.body.style.overflow="hidden"};
function shareP(id,mode){const p=S.products.find(x=>x.id===id),u=`https://t.me/${BOT}?start=${p.code}`;
 if(mode){tg?tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(u)}&text=${encodeURIComponent(p.title)}`):window.open(u)}
 else{navigator.clipboard?.writeText(u);tg?.HapticFeedback?.notificationOccurred("success");event.currentTarget.textContent="✓"}}
function stars(n){const k=Math.round(n);return"★".repeat(k)+"☆".repeat(5-k)}
function openProduct(id){const p=S.products.find(x=>x.id===id),s=status(id),b=BADGE(p);tg?.HapticFeedback?.impactOccurred("light");
 const buy=s?`<button class=cta2 onclick="tg?.close()">${s==="approved"?"✅ "+t("owned"):"⏳ "+t("wait")}</button>`:`<button class=cta2 onclick="checkout('${id}')">⬇ ${t("dl")} · ${money(p.price)}</button>`;
 const rate=s==="approved"?`<button class=cta2 style="background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:10px" onclick="rateP('${id}')">${t("rate")}</button>`:"";
 page(`<button class=bk onclick="closeSheet()" aria-label="${t("close")}">←</button>
 <div class=hero2>${p.cover_url?`<img class=fbg src="${esc(p.cover_url)}" alt="" aria-hidden=true>`:""}<span class="bd l">${b||"⚡ DIGITAL"}</span>${p.sales>0?`<span class="bd r">● ${p.sales} ${t("sold")}</span>`:""}${p.cover_url?`<img class=pc src="${esc(p.cover_url)}" alt="" fetchpriority=high onclick="viewCover('${id}')"><span class=zm>⤢ ${t("full")}</span>`:""}</div>
 ${buy}${rate}<div class=shr><button onclick="shareP('${id}',0)" aria-label="Copy link">🔗</button><button onclick="shareP('${id}',1)" aria-label="Share">📤</button></div>
 <div class=info><div class=rw><span class=dg>⚡ DIGITAL</span>${s?"":`<button class=pb onclick="checkout('${id}')">${money(p.price)}</button>`}</div><h2>${esc(p.title)}</h2><div class=big>${was(p)}${num(p.price)} <small>${t("etb")}</small></div>
 ${p.reviews?`<div class=stars style="margin-top:6px">${stars(p.rating)} <b style="color:var(--ink)">${p.rating}</b> <span style="color:var(--mut)">· ${p.reviews}</span></div>`:""}${descHtml(p.description)}<div id=rv></div></div><div class=stats><div class=sc><small>${t("deliv")}</small><b>⚡ ${t("delivV")}</b></div><div class=sc><small>${t("sales")}</small><b>🌐 ${p.sales>0?p.sales+" "+t("sold"):t("new")}</b></div><div class=sc><small>${t("creator")}</small><b style="color:#7C3AED">${CREATOR}</b></div></div><button class=up aria-label="Top" onclick="$('.pg').scrollTo({top:0,behavior:'smooth'})">↑</button>`);loadRv(id)}
async function loadRv(id){try{const r=await api("/api/reviews/"+id);if(!r.length||!$("#rv"))return;$("#rv").innerHTML=`<h3 style="margin:6px 0">${t("rev")}</h3>`+r.map(x=>`<div class=rv><span class=stars>${stars(x.rating)}</span> <b>${esc(x.name)}</b>${x.text?`<div>${esc(x.text)}</div>`:""}</div>`).join("")}catch{}}
let R={};
function rateP(id){R={id,n:5,t:""};drawRate()}
function drawRate(msg=""){sheet(`<div class=sb><h2>${esc(S.products.find(x=>x.id===R.id).title)}</h2><div class=star-in>${[1,2,3,4,5].map(i=>`<button class="${i<=R.n?"on":""}" onclick="R.t=$('#rt').value;R.n=${i};drawRate()" aria-label="${i}">★</button>`).join("")}</div><textarea id=rt rows=3 placeholder="${t("rph")}">${esc(R.t)}</textarea><p class=err>${esc(msg)}</p><button class=btn onclick="sendRate()">${t("rsend")}</button><button class="btn alt" onclick="openProduct('${R.id}')">${t("close")}</button></div>`)}
async function sendRate(){R.t=$("#rt").value;try{await api("/api/reviews",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({product_id:R.id,rating:R.n,text:R.t})});const c=await api("/api/catalog");S.products=c.products;tg?.HapticFeedback?.notificationOccurred("success");sheet(`<div class=sb><div class=ok><div class=tick>★</div><h2>${t("rthx")}</h2></div><button class=btn onclick="openProduct('${R.id}')">${t("close")}</button></div>`)}catch(e){drawRate(e.message)}}
const BR={cbe:["CBE","#7B2D8E"],awash:["Awash Bank","#1F5FA8"],telebirr:["Telebirr","#1BA24B"]};let C={};
const saved=()=>{try{return JSON.parse(localStorage.getItem("bifa_payer"))||{}}catch{return{}}};
function savePayer(v){C.info=v;const s=saved();s[C.method]=v;try{localStorage.setItem("bifa_payer",JSON.stringify(s))}catch{}}
function checkout(id){const k=Object.keys(S.pay)[0];C={id,method:k,file:null,info:saved()[k]||""};drawCheckout()}
function setM(k){C.method=k;C.info=saved()[k]||"";drawCheckout()}
function drawCheckout(msg=""){const p=S.products.find(x=>x.id===C.id),a=S.pay[C.method]||{};
 sheet(`<div class=sb><h2>${esc(p.title)}</h2><div class=big style="color:var(--em)">${num(p.price)} <small>${t("etb")}</small></div>
 <div class=tabs>${Object.keys(S.pay).map(k=>`<button class="tb ${C.method===k?"on":""}" style="--c:${BR[k]?.[1]||"#888"}" onclick="setM('${k}')">${BR[k]?.[0]||k}</button>`).join("")}</div>
 <div class=accbox><small style="color:var(--mut)">${esc(a.holder)}</small><div class=acc><div>${esc(a.account)}</div><span onclick="navigator.clipboard?.writeText('${esc(a.account)}');this.textContent='${t("copied")}'">${t("copy")}</span></div><small>${t("amt")}: <b>${money(p.price)}</b></small></div>
 <label>${C.method==="telebirr"?t("phone"):t("bank")}</label><input type=text id=pi value="${esc(C.info||"")}" oninput="savePayer(this.value)" ${C.method==="telebirr"?"inputmode=tel":""}>
 <label>Screenshot</label><label class=drop>${C.file?`<img src="${C.url}" alt="">`:t("shot")}<input type=file accept="image/*" hidden onchange="pick(this.files[0])"></label>
 <p class=err>${esc(msg)}</p><button class=btn id=go onclick="submitOrder()">${t("send")}</button><button class="btn alt" onclick="openProduct('${C.id}')">${t("close")}</button></div>`)}
const keep=()=>{C.info=$("#pi")?.value??C.info};
async function shrink(f){try{const b=await createImageBitmap(f),s=Math.min(1,1400/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=b.width*s;c.height=b.height*s;c.getContext("2d").drawImage(b,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",.82))||f}catch{return f}}
async function pick(f){if(!f)return;keep();C.file=await shrink(f);C.url=URL.createObjectURL(C.file);drawCheckout()}
async function submitOrder(){keep();if(!C.info||C.info.trim().length<3||!C.file)return drawCheckout(t("need"));
 const b=$("#go");b.disabled=true;b.textContent=t("sending");const fd=new FormData();fd.append("product_id",C.id);fd.append("method",C.method);fd.append("payer_info",C.info);fd.append("screenshot",C.file,"payment.jpg");
 try{const r=await api("/api/orders",{method:"POST",body:fd});S.orders=await api("/api/my/orders");tg?.HapticFeedback?.notificationOccurred("success");
  sheet(`<div class=sb><div class=ok><div class=tick>✓</div><h2>${t("done")}</h2><b>${esc(r.code)}</b><p>${t("doneP")}</p></div><button class=btn onclick="closeSheet();render()">${t("close")}</button></div>`)}
 catch(e){drawCheckout(e.message)}}
function descHtml(raw){const f=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
 const L=String(raw||"").replace(/\r/g,"").split("\n");let h="",ul=false;const close=()=>{if(ul){h+="</ul>";ul=false}};
 for(let l of L){l=l.trim();if(!l){close();continue}
  let m=l.match(/^(?:[-•*]|\d+[.)])\s+(.+)$/)||l.match(/^(?:[✅✔☑➤▪●📌🔹🔸⭐👉]\uFE0F?)\s*(.+)$/);
  if(m){if(!ul){h+="<ul class=bl>";ul=true}h+=`<li>${f(m[1])}</li>`;continue}
  close();
  if(/^\*\*.+\*\*$/.test(l)||(/[:：፦?፧]$/.test(l)&&l.length<70)){h+=`<h4>${f(l.replace(/^\*\*|\*\*$/g,"").replace(/[:：፦]$/,""))}</h4>`;continue}
  m=l.match(/^([^:：፦]{2,40}?)[:：፦]-?\s+(.+)$/);
  h+=m?`<div class=ln><b>${f(m[1])}:</b> ${f(m[2])}</div>`:`<div class=ln>${f(l)}</div>`}
 close();const long=String(raw||"").length>320;
 return`<div class=about><h3>${t("about")}</h3><div class="desc ${long?"clamp":""}" id=desc>${h}</div>${long?`<button class=more onclick="const d=$('#desc');d.classList.toggle('clamp');this.textContent=d.classList.contains('clamp')?'${t("more")}':'${t("less")}'">${t("more")}</button>`:""}</div>`}
function viewCover(id){const p=S.products.find(x=>x.id===id);if(!p?.cover_url)return;const d=document.createElement("div");d.className="vw";
 d.innerHTML=`<img src="${esc(p.cover_url)}" alt=""><button aria-label="${t("close")}">✕</button>`;
 d.onclick=e=>{if(e.target.tagName==="IMG"){d.classList.toggle("z");return}d.remove()};document.body.appendChild(d)}
init();
</script></body></html>
